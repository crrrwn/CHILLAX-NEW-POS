<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Chillax Café POS — Cashier</title>
<link rel="icon" href="assets/logo.jpg" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/print.css" />
</head>
<body>
  <header class="topbar">
    <img class="logo" src="assets/logo.jpg" alt="Chillax logo" />
    <div class="titles">
      <strong>Chillax Café</strong>
      <span>Point of Sale</span>
    </div>
    <span class="role-pill" id="role-pill">Cashier</span>
    <a href="admin.html" class="icon-btn" title="Admin" id="admin-link">
      <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h2v8H3v-8zm7 0h2v8h-2v-8zm7 0h2v8h-2v-8zM3 3h2v6H3V3zm7 0h2v6h-2V3zm7 0h2v6h-2V3z" fill="currentColor"/></svg>
    </a>
    <button class="icon-btn" id="logout-btn" title="Sign out" aria-label="Sign out">
      <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-8v-2h8V5h-8V3zm-1.4 4.6L12.2 12l-3.6 4.4 1.4 1.2L15 12l-4-5.8-1.4 1.4zM3 11v2h8v-2H3z" fill="currentColor"/></svg>
    </button>
  </header>

  <main class="pos-layout">
    <section class="menu-pane">
      <div class="menu-heading"><div><p class="eyebrow">CASHIER · MENU</p><h1>Choose a favorite</h1><p class="section-description">Tap a product to add it to the order.</p></div><label class="search-box"><span aria-hidden="true">⌕</span><input id="menu-search" type="search" placeholder="Search menu..." autocomplete="off" aria-label="Search menu" /></label></div>
      <div class="menu-result-bar"><span id="item-count">Loading menu...</span></div>
      <div class="category-tabs" id="category-tabs"></div>
      <div class="item-grid" id="item-grid"></div>
    </section>

    <aside class="cart-pane">
      <div class="cart-header">
        <h2>Current order <span class="cart-count" id="cart-count">0</span></h2>
        <div class="order-no">Order number is assigned at checkout</div>
      </div>
      <div class="order-options"><label>Customer / Order name<input id="customer-name" placeholder="Customer name (optional)"></label><label>Order type<select id="order-type"><option value="Dine In">Dine In</option><option value="Take Out">Take Out</option></select></label><label>Payment<select id="payment-method"><option>Cash</option><option>GCash</option></select></label><small>Take out: ₱15 per food item; drinks exempt.</small></div><div class="cart-items" id="cart-items"></div>
      <div class="cart-footer">
        <div class="cart-total-row">
          <span class="label">Total <small id="box-fee-label"></small></span>
          <span class="amount" id="cart-total">₱0</span>
        </div>
        <button class="btn btn-primary btn-block" id="checkout-btn" disabled>
          Place order &amp; print
        </button>
        <button class="btn btn-outline btn-block reprint-btn" id="reprint-last-btn" type="button" disabled>Reprint last receipt (58mm)</button>
      </div>
    </aside>
  </main>

  <div id="modal-root"></div>
  <div class="status-banner hidden" role="status" id="connection-banner"></div>
  <div class="toast hidden" id="toast"></div>

  <!-- Printable area (only visible when printing, see print.css) -->
  <div id="print-area"></div>

  <script type="module" src="js/pos.js"></script>
</body>
</html>
