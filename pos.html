
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Chillax Café POS — Cashier</title>

  <link rel="icon" href="assets/logo.jpg" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/print.css" />

  <style>
    /* GENERAL */
    @media screen {
      .pos-layout,
      .menu-pane,
      .cart-pane {
        min-width: 0;
      }

      .cart-pane {
        display: flex;
        flex-direction: column;
      }

      .cart-items {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
      }

      .cart-footer,
      .cart-header {
        flex-shrink: 0;
      }

      .cart-header-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .cart-header-top h2 {
        margin: 0;
      }

      .order-close,
      .order-mobile-bar,
      .order-backdrop {
        display: none;
      }

      .order-close {
        width: 38px;
        height: 38px;
        flex: 0 0 38px;
        border: 0;
        border-radius: 10px;
        background: #f4efea;
        color: #50362b;
        font-size: 25px;
        cursor: pointer;
      }
    }

    /*
      DESKTOP AND TABLET LANDSCAPE
      Menu left, Current Order right.
    */
    @media screen and (min-width: 901px),
           screen and (min-width: 700px) and (orientation: landscape) {

      .pos-layout {
        display: grid !important;
        grid-template-columns:
          minmax(0, 1fr)
          clamp(315px, 35%, 390px) !important;

        height: calc(100dvh - 68px) !important;
        min-height: 0 !important;
        overflow: hidden !important;
      }

      .menu-pane {
        min-width: 0;
        min-height: 0;
        overflow-y: auto !important;
        padding-bottom: 24px !important;
      }

      .cart-pane {
        display: flex !important;
        position: static !important;
        inset: auto !important;
        width: 100% !important;
        max-width: none !important;
        height: 100% !important;
        min-height: 0 !important;
        margin: 0 !important;
        border-radius: 0 !important;
        transform: none !important;
        visibility: visible !important;
        pointer-events: auto !important;
        overflow: hidden !important;
      }

      .cart-items {
        flex: 1 1 auto !important;
        max-height: none !important;
        overflow-y: auto !important;
      }

      .order-close,
      .order-mobile-bar,
      .order-backdrop {
        display: none !important;
      }
    }

    /*
      MOBILE AND PORTRAIT TABLET
      Slide-out Current Order panel.
    */
    @media screen and (max-width: 699px),
           screen and (max-width: 900px) and (orientation: portrait) {

      .pos-layout {
        display: block !important;
        height: auto !important;
        min-height: calc(100dvh - 62px) !important;
        overflow: visible !important;
      }

      .menu-pane {
        overflow: visible !important;
        padding-bottom: 105px !important;
      }

      .order-backdrop:not([hidden]) {
        display: block !important;
        position: fixed;
        inset: 0;
        background: rgba(30, 20, 15, 0.58);
        z-index: 80;
      }

      .cart-pane {
        display: flex !important;
        flex-direction: column;
        position: fixed !important;
        inset: 0 0 0 auto !important;
        width: min(100%, 430px) !important;
        max-width: 100% !important;
        height: 100dvh !important;
        min-height: 0 !important;
        margin: 0 !important;
        border: 0 !important;
        border-radius: 18px 0 0 18px !important;
        z-index: 90;
        background: #fff;
        box-shadow: -10px 0 36px rgba(0,0,0,.23);
        transform: translateX(105%) !important;
        visibility: hidden !important;
        pointer-events: none !important;
        overflow: hidden !important;
        transition:
          transform .2s ease,
          visibility .2s ease;
      }

      .cart-pane.is-open {
        transform: translateX(0) !important;
        visibility: visible !important;
        pointer-events: auto !important;
      }

      .cart-header {
        padding: 13px 16px 10px;
      }

      .order-close {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .order-options {
        padding: 11px 16px;
        gap: 8px;
      }

      .order-options input,
      .order-options select {
        min-height: 38px;
      }

      .cart-items {
        flex: 1 1 auto !important;
        min-height: 70px !important;
        max-height: none !important;
        overflow-y: auto !important;
        padding: 4px 16px;
      }

      .cart-footer {
        padding: 12px 16px
          max(14px, env(safe-area-inset-bottom));
      }

      .order-mobile-bar {
        display: flex !important;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: max(12px, env(safe-area-inset-bottom));
        z-index: 70;
        min-height: 64px;
        padding: 11px 17px;
        border: 0;
        border-radius: 16px;
        background: #563626;
        box-shadow: 0 12px 28px rgba(31,20,15,.25);
        color: #fff;
        text-align: left;
        cursor: pointer;
      }

      .order-mobile-bar strong,
      .order-mobile-bar small {
        display: block;
      }

      .order-mobile-bar small {
        opacity: .8;
        margin-top: 3px;
      }

      .mobile-order-price {
        font-size: 18px;
        font-weight: 800;
        white-space: nowrap;
      }

      body.order-drawer-open {
        overflow: hidden;
      }
    }

    /* SHORT MOBILE LANDSCAPE */
    @media screen and (max-width: 699px)
      and (orientation: landscape)
      and (max-height: 500px) {

      .cart-pane {
        overflow-y: auto !important;
      }

      .cart-items {
        flex: 0 0 auto !important;
        min-height: 80px !important;
      }

      .cart-footer {
        position: sticky;
        bottom: 0;
      }
    }

    /* KEEP 58MM PRINT LAYOUT */
    @media print {
      .order-mobile-bar,
      .order-backdrop,
      .order-close {
        display: none !important;
      }
    }
  </style>
</head>

<body>

  <!-- POS HEADER -->
  <header class="topbar">
    <img
      class="logo"
      src="assets/logo.jpg"
      alt="Chillax Café logo"
    />

    <div class="titles">
      <strong>Chillax Café</strong>
      <span>Point of Sale</span>
    </div>

    <span class="role-pill" id="role-pill">
      Cashier
    </span>

    <a
      href="admin.html"
      class="icon-btn"
      id="admin-link"
      title="Admin"
      aria-label="Admin dashboard"
    >
      <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M3 13h2v8H3v-8zm7 0h2v8h-2v-8zm7 0h2v8h-2v-8zM3 3h2v6H3V3zm7 0h2v6h-2V3zm7 0h2v6h-2V3z"
          fill="currentColor"
        />
      </svg>
    </a>

    <button
      type="button"
      class="icon-btn"
      id="logout-btn"
      title="Sign out"
      aria-label="Sign out"
    >
      <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M10 3h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-8v-2h8V5h-8V3zm-1.4 4.6L12.2 12l-3.6 4.4 1.4 1.2L15 12l-4-5.8-1.4 1.4zM3 11v2h8v-2H3z"
          fill="currentColor"
        />
      </svg>
    </button>
  </header>

  <!-- POS MAIN -->
  <main class="pos-layout">

    <!-- PRODUCT MENU -->
    <section class="menu-pane" aria-label="Product menu">

      <div class="menu-heading">
        <div>
          <p class="eyebrow">CASHIER · MENU</p>
          <h1>Choose a favorite</h1>
          <p class="section-description">
            Tap a product to add it to the current order.
          </p>
        </div>

        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input
            id="menu-search"
            type="search"
            placeholder="Search menu..."
            autocomplete="off"
            aria-label="Search menu"
          />
        </label>
      </div>

      <div class="menu-result-bar">
        <span id="item-count">Loading menu...</span>
      </div>

      <div class="category-tabs" id="category-tabs"></div>

      <div class="item-grid" id="item-grid"></div>

    </section>

    <!-- CURRENT ORDER / PREVIEW ORDER -->
    <aside
      class="cart-pane"
      id="current-order-panel"
      aria-label="Current order"
    >

      <div class="cart-header">
        <div class="cart-header-top">

          <h2>
            Current Order
            <span class="cart-count" id="cart-count">0</span>
          </h2>

          <button
            type="button"
            class="order-close"
            id="close-current-order"
            aria-label="Close current order"
          >
            &times;
          </button>
        </div>

        <div class="order-no">
          Order number will be assigned at checkout.
        </div>
      </div>

      <!-- CUSTOMER INFORMATION -->
      <div class="order-options">

        <label for="customer-name">
          Customer / Order Name
          <input
            id="customer-name"
            type="text"
            placeholder="Customer name (optional)"
            autocomplete="off"
          />
        </label>

        <label for="order-type">
          Order Type
          <select id="order-type">
            <option value="Dine In">Dine In</option>
            <option value="Take Out">Take Out</option>
          </select>
        </label>

        <label for="payment-method">
          Payment
          <select id="payment-method">
            <option value="Cash">Cash</option>
            <option value="GCash">GCash</option>
          </select>
        </label>

        <small>
          Take out: ₱15 per food item; drinks are exempt.
        </small>

      </div>

      <!-- ORDER PRODUCTS -->
      <div
        class="cart-items"
        id="cart-items"
        aria-live="polite"
      >
        <div class="cart-empty">
          Tap a menu item to start a new order.
        </div>
      </div>

      <!-- ORDER TOTAL -->
      <div class="cart-footer">

        <div class="cart-total-row">
          <span class="label">
            Total
            <small id="box-fee-label"></small>
          </span>

          <span class="amount" id="cart-total">₱0</span>
        </div>

        <button
          type="button"
          class="btn btn-primary btn-block"
          id="checkout-btn"
          disabled
        >
          Place order &amp; print
        </button>

        <button
          type="button"
          class="btn btn-outline btn-block reprint-btn"
          id="reprint-last-btn"
          disabled
        >
          Reprint last receipt (58mm)
        </button>

      </div>
    </aside>

  </main>

  <!-- MOBILE BACKDROP -->
  <div
    class="order-backdrop"
    id="order-backdrop"
    hidden
  ></div>

  <!-- MOBILE ORDER BUTTON -->
  <button
    type="button"
    class="order-mobile-bar"
    id="mobile-order-toggle"
    aria-controls="current-order-panel"
    aria-expanded="false"
  >
    <span>
      <strong>
        View Current Order
        (<span id="mobile-cart-count">0</span>)
      </strong>
      <small>Tap to review and checkout</small>
    </span>

    <span
      class="mobile-order-price"
      id="mobile-cart-total"
    >
      ₱0
    </span>
  </button>

  <!-- POS ELEMENTS -->
  <div id="modal-root"></div>
  <div
    class="status-banner hidden"
    role="status"
    id="connection-banner"
  ></div>
  <div class="toast hidden" id="toast"></div>
  <div id="print-area"></div>

  <!-- POS FUNCTIONS -->
  <script type="module" src="js/pos.js"></script>

  <!-- RESPONSIVE ORDER CONTROLLER -->
  <script>
    (() => {
      const panel = document.getElementById(
        "current-order-panel"
      );

      const toggle = document.getElementById(
        "mobile-order-toggle"
      );

      const close = document.getElementById(
        "close-current-order"
      );

      const backdrop = document.getElementById(
        "order-backdrop"
      );

      const count = document.getElementById(
        "cart-count"
      );

      const total = document.getElementById(
        "cart-total"
      );

      const mobileCount = document.getElementById(
        "mobile-cart-count"
      );

      const mobileTotal = document.getElementById(
        "mobile-cart-total"
      );

      // Drawer only for phones and portrait tablets.
      // Tablet landscape stays side-by-side.
      const drawerMode = window.matchMedia(
        "(max-width: 699px), " +
        "(max-width: 900px) and (orientation: portrait)"
      );

      let previousCount = 0;

      function openOrder() {
        if (!drawerMode.matches) return;

        panel.classList.add("is-open");

        document.body.classList.add(
          "order-drawer-open"
        );

        panel.removeAttribute("aria-hidden");
        backdrop.hidden = false;

        toggle.setAttribute(
          "aria-expanded",
          "true"
        );

        close.focus();
      }

      function closeOrder(restoreFocus = true) {
        const wasOpen = panel.classList.contains(
          "is-open"
        );

        panel.classList.remove("is-open");

        document.body.classList.remove(
          "order-drawer-open"
        );

        backdrop.hidden = true;

        toggle.setAttribute(
          "aria-expanded",
          "false"
        );

        if (drawerMode.matches) {
          panel.setAttribute(
            "aria-hidden",
            "true"
          );

          if (wasOpen && restoreFocus) {
            toggle.focus();
          }
        } else {
          panel.removeAttribute("aria-hidden");
        }
      }

      function refreshMobileBar() {
        const qty = Math.max(
          0,
          parseInt(count.textContent, 10) || 0
        );

        mobileCount.textContent = String(qty);

        mobileTotal.textContent =
          total.textContent || "₱0";

        // Automatically preview the first added item
        // when the drawer mode is active.
        if (
          drawerMode.matches &&
          previousCount === 0 &&
          qty > 0
        ) {
          openOrder();
        }

        previousCount = qty;
      }

      toggle.addEventListener(
        "click",
        openOrder
      );

      close.addEventListener(
        "click",
        () => closeOrder()
      );

      backdrop.addEventListener(
        "click",
        () => closeOrder()
      );

      document.addEventListener(
        "keydown",
        event => {
          if (
            event.key === "Escape" &&
            panel.classList.contains("is-open") &&
            !document.querySelector(
              "#modal-root .modal-backdrop"
            )
          ) {
            closeOrder();
          }
        }
      );

      // Restore the permanent panel when
      // rotating a tablet to landscape.
      drawerMode.addEventListener(
        "change",
        () => closeOrder(false)
      );

      // Watch updates from js/pos.js.
      new MutationObserver(
        refreshMobileBar
      ).observe(count, {
        childList: true,
        characterData: true,
        subtree: true
      });

      new MutationObserver(
        refreshMobileBar
      ).observe(total, {
        childList: true,
        characterData: true,
        subtree: true
      });

      if (drawerMode.matches) {
        panel.setAttribute(
          "aria-hidden",
          "true"
        );
      }

      refreshMobileBar();
    })();
  </script>

</body>
</html>
