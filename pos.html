<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Chillax Café POS — Cashier</title>
<link rel="icon" href="assets/logo.jpg" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/print.css" />
</head>
<body>
  <header class="topbar">
    <img class="logo" src="assets/logo.jpg" alt="Chillax logo" />
    <div class="titles">
      <strong>Chillax Café</strong>
      <span>Point of Sale</span>
    </div>
    <span class="role-pill" id="role-pill">Cashier</span>
    <a href="admin.html" class="icon-btn" title="Admin" id="admin-link">
      <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h2v8H3v-8zm7 0h2v8h-2v-8zm7 0h2v8h-2v-8zM3 3h2v6H3V3zm7 0h2v6h-2V3zm7 0h2v6h-2V3z" fill="currentColor"/></svg>
    </a>
    <button class="icon-btn" id="logout-btn" title="Sign out" aria-label="Sign out">
      <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-8v-2h8V5h-8V3zm-1.4 4.6L12.2 12l-3.6 4.4 1.4 1.2L15 12l-4-5.8-1.4 1.4zM3 11v2h8v-2H3z" fill="currentColor"/></svg>
    </button>
  </header>

  <main class="pos-layout">
    <section class="menu-pane">
      <div class="category-tabs" id="category-tabs"></div>
      <div class="item-grid" id="item-grid"></div>
    </section>

    <aside class="cart-pane">
      <div class="cart-header">
        <h2>Current Order</h2>
        <div class="order-no">Items get numbered automatically at checkout</div>
      </div>
      <div class="cart-items" id="cart-items"></div>
      <div class="cart-footer">
        <div class="cart-total-row">
          <span class="label">Total</span>
          <span class="amount" id="cart-total">₱0</span>
        </div>
        <button class="btn btn-primary btn-block" id="checkout-btn" disabled>
          Place order &amp; print
        </button>
      </div>
    </aside>
  </main>

  <div id="modal-root"></div>
  <div class="toast hidden" id="toast"></div>

  <!-- Printable area (only visible when printing, see print.css) -->
  <div id="print-area"></div>

  <script type="module" src="js/pos.js"></script>
</body>
</html>
