<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Chillax Café POS — Cashier</title>
<link rel="icon" href="assets/logo.jpg" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/print.css" />
</head>
<body>
  <header class="topbar">
    <img class="logo" src="assets/logo.jpg" alt="Chillax logo" />
    <div class="titles">
      <strong>Chillax Café</strong>
      <span>Point of Sale</span>
    </div>
    <span class="role-pill" id="role-pill">Cashier</span>
    <a href="admin.html" class="icon-btn" title="Admin" id="admin-link">📊</a>
    <button class="icon-btn" id="logout-btn" title="Sign out">⏻</button>
  </header>

  <main class="pos-layout">
    <section class="menu-pane">
      <div class="category-tabs" id="category-tabs"></div>
      <div class="item-grid" id="item-grid"></div>
    </section>

    <aside class="cart-pane">
      <div class="cart-header">
        <h2>Current Order</h2>
        <div class="order-no">Items get numbered automatically at checkout</div>
      </div>
      <div class="cart-items" id="cart-items"></div>
      <div class="cart-footer">
        <div class="cart-total-row">
          <span class="label">Total</span>
          <span class="amount" id="cart-total">₱0</span>
        </div>
        <button class="btn btn-primary btn-block" id="checkout-btn" disabled>
          Place order &amp; print
        </button>
      </div>
    </aside>
  </main>

  <div id="modal-root"></div>
  <div class="toast hidden" id="toast"></div>

  <!-- Printable area (only visible when printing, see print.css) -->
  <div id="print-area"></div>

  <script type="module" src="js/pos.js"></script>
</body>
</html>
