<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Chillax Café POS — Sign in</title>
<link rel="icon" href="assets/logo.jpg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <img class="logo" src="assets/logo.jpg" alt="Chillax Café logo" />
      <h1>Chillax Café</h1>
      <p class="tag">Point of Sale</p>

      <div class="role-toggle">
        <button type="button" id="tab-staff" class="active">Cashier</button>
        <button type="button" id="tab-admin">Admin</button>
      </div>

      <div class="pin-dots" id="pin-dots">
        <span></span><span></span><span></span><span></span>
      </div>

      <div class="pin-pad" id="pin-pad">
        <button data-key="1">1</button>
        <button data-key="2">2</button>
        <button data-key="3">3</button>
        <button data-key="4">4</button>
        <button data-key="5">5</button>
        <button data-key="6">6</button>
        <button data-key="7">7</button>
        <button data-key="8">8</button>
        <button data-key="9">9</button>
        <button class="wide" data-key="clear">Clear</button>
        <button data-key="0">0</button>
        <button class="wide" data-key="back">⌫</button>
      </div>

      <div class="login-error" id="login-error"></div>
      <p class="login-hint"></p>
    </div>
  </div>

  <script type="module">
    import { getPins, setSession } from "./js/auth.js";

    let role = "staff";
    let pin = "";
    const MAX_LEN = 4;

    const tabStaff = document.getElementById("tab-staff");
    const tabAdmin = document.getElementById("tab-admin");
    const dotsEl = document.getElementById("pin-dots");
    const errorEl = document.getElementById("login-error");

    function setRole(r) {
      role = r;
      pin = "";
      errorEl.textContent = "";
      tabStaff.classList.toggle("active", r === "staff");
      tabAdmin.classList.toggle("active", r === "admin");
      renderDots();
    }

    function renderDots() {
      [...dotsEl.children].forEach((dot, i) => {
        dot.classList.toggle("filled", i < pin.length);
      });
    }

    tabStaff.addEventListener("click", () => setRole("staff"));
    tabAdmin.addEventListener("click", () => setRole("admin"));

    async function submitPin() {
      errorEl.textContent = "Checking…";
      try {
        const pins = await getPins();
        const expected = role === "admin" ? pins.adminPin : pins.staffPin;
        if (pin === expected) {
          setSession(role);
          window.location.href = role === "admin" ? "admin.html" : "pos.html";
        } else {
          errorEl.textContent = "Incorrect PIN. Try again.";
          pin = "";
          renderDots();
        }
      } catch (e) {
        console.error(e);
        errorEl.textContent = "Couldn't reach the server. Check your connection.";
        pin = "";
        renderDots();
      }
    }

    document.getElementById("pin-pad").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      const key = btn.dataset.key;
      errorEl.textContent = errorEl.textContent === "Checking…" ? "" : errorEl.textContent;
      if (key === "clear") {
        pin = "";
        errorEl.textContent = "";
      } else if (key === "back") {
        pin = pin.slice(0, -1);
      } else if (pin.length < MAX_LEN) {
        pin += key;
      }
      renderDots();
      if (pin.length === MAX_LEN) submitPin();
    });

    // Also allow a physical keyboard.
    window.addEventListener("keydown", (e) => {
      if (/^[0-9]$/.test(e.key) && pin.length < MAX_LEN) {
        pin += e.key;
        renderDots();
        if (pin.length === MAX_LEN) submitPin();
      } else if (e.key === "Backspace") {
        pin = pin.slice(0, -1);
        renderDots();
      }
    });
  </script>
</body>
</html>
